apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-lab
  template:
    metadata:
      labels:
        app: cicd-lab
    spec:
      containers:
        - name: app
          image: ghcr.io/chube260585/cicd-lab:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000